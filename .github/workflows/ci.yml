name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest

    env:
      # fastembed reads this and nothing else — not HF_HOME — and it does not
      # expand `~`, so the path is absolute. Set for every step in the job so
      # the run that populates the cache and the run that reads it agree.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed

    services:
      # The integration tests run against a real Postgres on purpose — the SQL
      # is the interesting part of retrieval, and a mock would test the mock.
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          # Without this every run re-downloads ~150 MB of ONNX models from the
          # Hub. It pointed at ~/.cache/huggingface, where fastembed has never
          # written anything, so the cache was saved empty and restored empty
          # and every run downloaded them anyway.
          path: ${{ github.workspace }}/.cache/fastembed
          # The models are named in the key: changing EMBED_MODEL or
          # RERANK_MODEL in config.py has to miss this cache rather than
          # restore the previous model's files under the new name.
          key: fastembed-${{ runner.os }}-bge-small-en-v1.5-ms-marco-MiniLM-L-6-v2-${{ hashFiles('api/app/config.py') }}
          # A partial match still saves the download for the models that did
          # not change, and the job then saves under the exact key above.
          restore-keys: |
            fastembed-${{ runner.os }}-

      - run: uv sync --frozen
        working-directory: api

      - run: uv run pytest
        working-directory: api
        env:
          DATABASE_URL: postgresql://rag:rag@localhost:5433/rag

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm run build
