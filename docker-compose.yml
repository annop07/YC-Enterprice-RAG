services:
  db:
    # pgvector ships the extension pre-built; the plain postgres image would
    # need it compiled in before `CREATE EXTENSION vector` works.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432" # 5433 on the host: 5432 is usually already taken
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
